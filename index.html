<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Aplicación</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <h1>CRUD de contactos</h1>
  <button id="btnCargar">Cargar Datos</button><br /><br />

  <label for="userId">ID del Usuario:</label><br />
  <input type="number" id="userId" placeholder="Ej: 1" /><br /><br />

  <label for="userName">Nuevo Nombre:</label><br />
  <input type="text" id="userName" placeholder="Nombre completo" /><br /><br />

  <label for="userEmail">Nuevo Email:</label><br />
  <input type="email" id="userEmail" placeholder="correo@ejemplo.com" /><br /><br />

  <button id="btnCambiar">Cambiar Datos</button>
  <button id="btnCrear">Crear Datos</button>

  <p>Resultados:</p>
  <div id="resultado"></div>
</body>
</html>
